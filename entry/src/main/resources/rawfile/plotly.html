<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./plotly.min.js" charset="utf-8"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0d0d0d; height: 100%; width: 100%; overflow: hidden; }
    #chart { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    window.renderFigure = function (jsonStr) {
      var el = document.getElementById('chart');
      try {
        var fig = JSON.parse(jsonStr);
        var config = fig.config || { responsive: true, displaylogo: false, displayModeBar: false };
        Plotly.react(el, fig.data, fig.layout, config);
      } catch (e) {
        el.innerHTML = '<pre style="color:#ef4444;font-size:12px;padding:8px;font-family:monospace">' + String(e) + '</pre>';
      }
    };
    window.clearFigure = function () {
      var el = document.getElementById('chart');
      try { Plotly.purge(el); } catch (e) {}
      el.innerHTML = '';
    };
  </script>
</body>
</html>
