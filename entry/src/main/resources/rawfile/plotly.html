<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./plotly.min.js" charset="utf-8"></script>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; height: 100%; width: 100%; overflow: hidden; }
    #chart { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    // Dashboard brush bridge (web PlotlyRenderer plotly_selected parity):
    // renderFigure(figureJson, metaJson) — meta {chartId,xField,yField} enables
    // selection reporting back to ArkTS via window.arkBridge.onBrush(json).
    var msMeta = null;
    function msHookSelection(el) {
      try { el.removeAllListeners('plotly_selected'); } catch (e) {}
      try { el.removeAllListeners('plotly_deselect'); } catch (e) {}
      el.on('plotly_selected', function (evt) {
        if (!window.arkBridge || !msMeta) { return; }
        var r = (evt && (evt.range || evt.ranges)) || {};
        var xr = r.xrange || r.x || null;
        var yr = r.yrange || r.y || null;
        var okX = xr && xr.length === 2;
        var okY = yr && yr.length === 2;
        if (!okX && !okY) { return; }
        window.arkBridge.onBrush(JSON.stringify({
          chartId: msMeta.chartId,
          xField: msMeta.xField,
          yField: msMeta.yField,
          xRange: okX ? xr : null,
          yRange: okY ? yr : null
        }));
      });
      el.on('plotly_deselect', function () {
        if (!window.arkBridge || !msMeta) { return; }
        window.arkBridge.onBrush(JSON.stringify({
          chartId: msMeta.chartId,
          xField: msMeta.xField,
          yField: msMeta.yField,
          xRange: null,
          yRange: null
        }));
      });
    }
    window.renderFigure = function (jsonStr, metaStr) {
      var el = document.getElementById('chart');
      try {
        var fig = JSON.parse(jsonStr);
        msMeta = null;
        if (metaStr) {
          try { msMeta = JSON.parse(metaStr); } catch (e) { msMeta = null; }
        }
        if (msMeta && msMeta.chartId) {
          fig.layout = fig.layout || {};
          fig.layout.dragmode = 'select'; // enable rectangle selection for brush
        }
        var config = fig.config || { responsive: true, displaylogo: false, displayModeBar: false };
        Plotly.react(el, fig.data, fig.layout, config);
        if (msMeta && msMeta.chartId) { msHookSelection(el); }
      } catch (e) {
        el.innerHTML = '<pre style="color:#ef4444;font-size:12px;padding:8px;font-family:monospace">' + String(e) + '</pre>';
      }
    };
    window.clearFigure = function () {
      var el = document.getElementById('chart');
      try { Plotly.purge(el); } catch (e) {}
      el.innerHTML = '';
      msMeta = null;
    };
  </script>
</body>
</html>
