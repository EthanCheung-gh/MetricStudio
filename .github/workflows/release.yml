name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PNPM_VERSION: 10.12.4

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
          - os: windows-2022
            artifact: windows
          # TEMP: macos-13 runner queue is heavily backlogged (queued 24h+).
          # Re-enable once demand subsides, or switch to macos-14 (arm64).
          # - os: macos-13
          #   artifact: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable pnpm BEFORE setup-node: the cache: pnpm lookup needs the
      # pnpm shim on PATH (newer runner images no longer preinstall it).
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging tools and Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev libssl-dev \
            librsvg2-dev patchelf rpm

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sidecar
        run: python scripts/build-sidecar.py

      - name: Sidecar smoke test
        shell: bash
        run: |
          SIDECAR=$(find src-tauri/binaries -maxdepth 1 -type f -name 'python-sidecar*' | head -1)
          python scripts/smoke-sidecar.py "$SIDECAR"

      - name: Build Tauri bundle
        run: pnpm tauri build

      - name: Check Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/check-bundle.py src-tauri/target/release/bundle/deb/*.deb
          python scripts/check-bundle.py src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metricstudio-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*
            !src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: metricstudio-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/**/* --generate-notes --verify-tag
